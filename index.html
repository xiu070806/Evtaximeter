async function resolveGap(force=false){if(!gap||gap.committed)return false;const g=gap,c=gapCandidates();if(!c){if(force&&g.samples.length){const good=g.samples.filter(valid),e=good.at(-1);if(e){const direct=hav(g.start,e),elapsed=Math.max(0,(e.ts-g.start.ts)/1000),upper=Math.min(55*elapsed,Math.max(direct,direct*1.5+50));if(gap===g&&!g.committed){trip.distanceKm+=clamp(direct,0,upper)/1000;g.committed=true;gap=null;activeSave();return true;}}}return false;}if(!force&&!c.stable)return false;const gkm=await googleGapKm(c);if(gap!==g||g.committed)return false;const maxKm=c.upper/1000,cands=[{km:c.localKm,w:.55},{km:c.direct/1000,w:.20}];if(c.path>0)cands.push({km:c.path/1000,w:.15});if(c.drCoverage>.35&&c.dr>0)cands.push({km:c.dr/1000,w:.10});if(gkm!==null)cands.push({km:gkm,w:.20});const sw=cands.reduce((a,x)=>a+x.w,0);let km=cands.reduce((a,x)=>a+x.km*x.w,0)/sw;km=clamp(km,0,maxKm);if(!c.stable)km=Math.min(km,c.direct/1000);if(!Number.isFinite(km))return false;trip.distanceKm+=km;g.committed=true;trip.lastGood={...g.samples.filter(valid).at(-1),ts:Date.now()};gap=null;activeSave();return true;}
function position(pos){if(state!=="RUNNING"&&state!=="FINISHING")return;const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:n(pos.coords.accuracy)||999,speed:Number.isFinite(pos.coords.speed)&&pos.coords.speed>=0?pos.coords.speed*3.6:null,ts:Date.now()};if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))return;if(p.accuracy>60){if(state==="RUNNING")beginGap("poor-accuracy");gpsStatus("warn",`GPS yếu • ±${Math.round(p.accuracy)} m`);return;}if(gap){gap.samples.push(p);if(recoveryStable(gap.samples))resolveGap(false);gpsStatus("warn",`GPS phục hồi • ${gap.samples.length} mẫu`);activeSave();return;}if(trip.lastGood){const d=hav(trip.lastGood,p),dt=Math.max(.2,(p.ts-trip.lastGood.ts)/1000),v=d/dt;if(v>55){beginGap("jump");gpsStatus("warn","GPS nhảy bất thường • đang xác nhận");activeSave();return;}if(d>=1.0)trip.distanceKm+=d/1000;}trip.lastGood=p;trip.dropoff={...p};if(!trip.pickup)trip.pickup={...p};trip.speedKmh=clamp(p.speed||0,0,250);gpsStatus("ok",`GPS tốt • ±${Math.round(p.accuracy)} m`);activeSave();ui();}
function geoError(){if(state==="RUNNING")beginGap("error")}
function watchStart(){if(!navigator.geolocation){gpsStatus("","Thiết bị không hỗ trợ GPS");return}watchStop();watch=navigator.geolocation.watchPosition(position,geoError,{enableHighAccuracy:true,maximumAge:1000,timeout:10000})}function watchStop(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}}async function wakeStart(){try{if("wakeLock"in navigator)wake=await navigator.wakeLock.request("screen")}catch{}}function wakeStop(){try{wake?.release()}catch{}wake=null}
function start(){if(state!=="IDLE")return;let t=cfg.tariffs.find(x=>x.id===cfg.tariffId)||cfg.tariffs[0];trip={id:uid(),startedAt:Date.now(),elapsedSeconds:0,pausedTotalMs:0,waitingSeconds:0,distanceKm:0,speedKmh:0,tariffId:t.id,tariffSnapshot:{...t},waitConfig:{enabled:!!cfg.waitingEnabled,freeWaitMin:n(cfg.freeWaitMin),rate:n(cfg.waitRate)},driverSnapshot:cfg.driver,plateSnapshot:cfg.plate,adjustment:{...adjust},pickup:null,dropoff:null};state="RUNNING";gap=null;activeSave();watchStart();wakeStart();tick();toast("Đã bắt đầu chuyến")}
function pause(){if(state!=="RUNNING")return;if(gap)gap=null;trip.pauseStartedAt=Date.now();state="PAUSED";watchStop();wakeStop();activeSave();ui();toast("Đã tạm dừng")}
function resume(){if(state!=="PAUSED")return;trip.pausedTotalMs+=Date.now()-n(trip.pauseStartedAt);trip.pauseStartedAt=null;state="RUNNING";if(trip.lastGood)trip.lastGood={...trip.lastGood,ts:Date.now()};watchStart();wakeStart();activeSave();ui();toast("Tiếp tục chuyến")}
function finalGPS(ms=3200){return new Promise(r=>{if(!navigator.geolocation)return r(null);let done=false,t=setTimeout(()=>{if(!done){done=true;r(null)}},ms);navigator.geolocation.getCurrentPosition(p=>{clearTimeout(t);if(!done){done=true;r(p)}},()=>{clearTimeout(t);if(!done){done=true;r(null)}},{enableHighAccuracy:true,maximumAge:0,timeout:ms})})}
async function finishTrip(){if(state!=="RUNNING"&&state!=="PAUSED")return;const wasPaused=state==="PAUSED";state="FINISHING";watchStop();wakeStop();const p=await finalGPS();if(p&&!wasPaused)position(p);if(gap)await resolveGap(true);if(p&&p.coords.accuracy<=60)trip.dropoff={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:n(p.coords.accuracy),speed:Number.isFinite(p.coords.speed)&&p.coords.speed>=0?p.coords.speed*3.6:null,ts:Date.now()};else if(trip.lastGood)trip.dropoff={...trip.lastGood};const pausedNow=wasPaused&&trip.pauseStartedAt?Date.now()-trip.pauseStartedAt:0;trip.elapsedSeconds=Math.max(0,Math.floor((Date.now()-trip.startedAt-trip.pausedTotalMs-pausedNow)/1000));trip.adjustment={...adjust};trip.totalFare=finalTotal(trip);$("finalAmount").textContent=money(trip.totalFare);$("finalMeta").textContent=`${trip.distanceKm.toFixed(2)} km • ${time(trip.elapsedSeconds)}`;$("debtBox").classList.add("hidden");open("finishModal");activeSave();ui();}
function finalize(method,status,customer=""){if(!trip)return;trip.payment={method,status};trip.status=status;trip.customer=customer;trip.totalFare=finalTotal(trip);trip.qrSnapshot=status==="UNPAID"?{...cfg.vietqr}:null;trips.unshift({...trip,finishedAt:Date.now()});trips=trips.slice(0,500);save();activeClear();trip=null;state="IDLE";gap=null;adjust={discount:0,percent:0,surcharge:0,toll:0};closeAll();ui();renderHistory();renderRevenue();toast(status==="UNPAID"?"Đã lưu công nợ":"Đã lưu chuyến")}
function tick(){if(trip&&(state==="RUNNING"||state==="PAUSED")){if(state==="RUNNING"&&trip.speedKmh<2)trip.waitingSeconds+=1;trip.elapsedSeconds=Math.max(0,Math.floor((Date.now()-trip.startedAt-trip.pausedTotalMs)/1000));activeSave();ui()}}
function ui(){$("tariffName").textContent=cfg.tariffs.find(x=>x.id===cfg.tariffId)?.name||"Biểu cước";$("adjustValue").textContent=money(-n(adjust.discount)-base()*n(adjust.percent)/100+n(adjust.surcharge)+n(adjust.toll));$("amount").innerHTML=money(state==="IDLE"?0:total()).replace(" đ","<small>đ</small>");$("km").textContent=(trip?.distanceKm||0).toFixed(2);$("speed").textContent=Math.round(trip?.speedKmh||0);$("duration").textContent=time(trip?.elapsedSeconds||0);$("pickup").textContent=trip?.pickup?`${trip.pickup.lat.toFixed(5)}, ${trip.pickup.lon.toFixed(5)}`:"Chưa xác định";$("drop").textContent=trip?.dropoff?`${trip.dropoff.lat.toFixed(5)}, ${trip.dropoff.lon.toFixed(5)}`:"Chưa xác định";let active=state==="RUNNING"||state==="PAUSED";$("start").classList.toggle("hidden",active);$("split").classList.toggle("hidden",!active);$("pause").textContent=state==="PAUSED"?"▶ TIẾP TỤC":"Ⅱ TẠM DỪNG";$("pause").classList.toggle("resume",state==="PAUSED")}
function open(id){closeAll(id);$(id).classList.add("open")}function closeAll(except=""){["adjustModal","tariffModal","finishModal","invoiceModal","customerModal"].forEach(id=>{if(id!==except)$(id).classList.remove("open")})}
function adjustmentPreview(){let b=base(),d=-n($("disc").value)-b*n($("pct").value)/100+n($("sur").value)+n($("toll").value);$("delta").textContent=money(d)}function renderTariffs(){$("tariffs").innerHTML=cfg.tariffs.map(t=>`<button class="card row" data-t="${esc(t.id)}" style="width:100%;text-align:left"><span><b>${esc(t.name)}</b><br><span class="mini muted">${money(t.base)} mở cửa • ${money(t.perKm)}/km</span></span><b>${t.id===cfg.tariffId?"✓":""}</b></button>`).join("");$("tariffs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(state!=="IDLE"){toast("Không đổi biểu cước giữa chuyến");return}cfg.tariffId=b.dataset.t;save();renderTariffs();ui();closeAll()})}
function renderHistory(){$("history").innerHTML=trips.length?trips.map(t=>`<div class="card"><div class="row"><div><span class="mini muted">${new Date(t.finishedAt||t.startedAt).toLocaleString("vi-VN")}</span><div style="font-size:22px;font-weight:850">${money(t.totalFare)}</div></div><span>${t.status==="UNPAID"?"🔴 GHI NỢ":"🟢 ĐÃ THU"}</span></div><div class="mini muted" style="margin:7px 0">${esc(t.customer||"Khách lẻ")} • ${n(t.distanceKm).toFixed(2)} km • ${time(t.elapsedSeconds)}</div><button class="btn" data-inv="${esc(t.id)}">Xem hóa đơn</button></div>`).join(""):"<div class='card muted' style='text-align:center'>Chưa có chuyến đã hoàn thành.</div>";$('history').querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>showInvoice(trips.find(t=>t.id===b.dataset.inv)))}
function renderRevenue(){let all=trips.reduce((s,t)=>s+n(t.totalFare),0),paid=trips.filter(t=>t.status==="PAID").reduce((s,t)=>s+n(t.totalFare),0),debt=trips.filter(t=>t.status==="UNPAID").reduce((s,t)=>s+n(t.totalFare),0),g={};trips.filter(t=>t.status==="UNPAID").forEach(t=>{let k=t.customer||"Khách chưa đặt tên";(g[k]??=[]).push(t)});$("revenue").innerHTML=`<div class="card"><div class="row"><span>Doanh thu</span><b>${money(all)}</b></div><div class="row" style="margin-top:9px"><span>Đã thu</span><b>${money(paid)}</b></div><div class="row" style="margin-top:9px"><span>Công nợ</span><b>${money(debt)}</b></div><div class="row" style="margin-top:9px"><span>Số chuyến</span><b>${trips.length}</b></div></div><div class="title" style="font-size:18px">Công nợ theo khách hàng</div>${Object.keys(g).length?Object.entries(g).map(([k,a])=>`<button class="card row" data-c="${esc(k)}" style="width:100%;text-align:left"><span><b>${esc(k)}</b><br><span class="mini muted">${a.length} chuyến</span></span><b>${money(a.reduce((s,t)=>s+n(t.totalFare),0))}</b></button>`).join(""):"<div class='card muted' style='text-align:center'>Không có công nợ.</div>"}`;$('revenue').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>showCustomer(b.dataset.c))}
function renderSettings(){$("settings").innerHTML=`<div class="card"><div class="field"><label>Tên tài xế</label><input id="driver" value="${esc(cfg.driver)}"></div><div class="field"><label>Biển số</label><input id="plate" value="${esc(cfg.plate)}"></div><div class="field"><label>Biểu cước</label><select id="tariffSet">${cfg.tariffs.map(t=>`<option value="${esc(t.id)}" ${t.id===cfg.tariffId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div class="switch"><span>Tính phí chờ</span><input id="waitEnabled" type="checkbox" ${cfg.waitingEnabled?"checked":""}></div><div class="field"><label>Miễn phí chờ (phút)</label><input id="freeWait" type="number" value="${n(cfg.freeWaitMin)}"></div><div class="field"><label>Giá/phút</label><input id="waitRate" type="number" value="${n(cfg.waitRate)}"></div><div class="field"><label>Hệ số bù GPS (trọng số DR)</label><input id="comp" type="number" min=".5" max="1.5" step=".05" value="${n(cfg.compFactor)}"></div><div class="switch"><span>Sổ cái quãng đường</span><input id="ledger" type="checkbox" ${cfg.distanceLedger?"checked":""}></div><div class="field"><label>Google Routes / Geocoding API Key</label><input id="google" type="password" value="${esc(cfg.googleKey)}"></div></div><div class="card"><b>VietQR</b><div class="field" style="margin-top:10px"><label>Ngân hàng</label><input id="bank" value="${esc(cfg.vietqr.bank)}"></div><div class="field"><label>Số tài khoản</label><input id="account" value="${esc(cfg.vietqr.account)}"></div><div class="field"><label>Tên chủ tài khoản</label><input id="holder" value="${esc(cfg.vietqr.holder)}"></div></div><button id="saveSet" class="start">LƯU CÀI ĐẶT</button>`;$('saveSet').onclick=()=>{Object.assign(cfg,{driver:$('driver').value.trim(),plate:$('plate').value.trim(),tariffId:$('tariffSet').value,waitingEnabled:$('waitEnabled').checked,freeWaitMin:Math.max(0,n($('freeWait').value)),waitRate:Math.max(0,n($('waitRate').value)),compFactor:clamp(n($('comp').value),.5,1.5),distanceLedger:$('ledger').checked,googleKey:$('google').value.trim(),vietqr:{bank:$('bank').value.trim(),account:$('account').value.trim(),holder:$('holder').value.trim()}});save();setPage('Clock');toast('Đã lưu cài đặt')}}
function invoiceHTML(t){return `<div class="invoice"><div class="row"><div><h3>EVTaximeter</h3><span class="mini">Mã chuyến: ${esc(t.id)}</span></div><b>${t.status==="UNPAID"?"GHI NỢ":"ĐÃ THANH TOÁN"}</b></div><table><tr><td>Tài xế</td><td>${esc(t.driverSnapshot||"—")}</td></tr><tr><td>Biển số</td><td>${esc(t.plateSnapshot||"—")}</td></tr><tr><td>Khách hàng</td><td>${esc(t.customer||"Khách lẻ")}</td></tr><tr><td>Quãng đường</td><td>${n(t.distanceKm).toFixed(2)} km</td></tr><tr><td>Thời lượng</td><td>${time(t.elapsedSeconds)}</td></tr><tr><td>Thanh toán</td><td>${t.status==="UNPAID"?"Ghi nợ":t.payment?.method==="transfer"?"Chuyển khoản":"Tiền mặt"}</td></tr></table><div class="invoiceTotal">${money(t.totalFare)}</div>${t.status==="UNPAID"&&t.qrSnapshot?.bank&&t.qrSnapshot?.account?`<div style="text-align:center;margin-top:10px"><img style="width:145px;height:145px" src="https://img.vietqr.io/image/${encodeURIComponent(t.qrSnapshot.bank)}-${encodeURIComponent(t.qrSnapshot.account)}-compact2.png?amount=${n(t.totalFare)}&addInfo=${encodeURIComponent('EVTX '+t.id.slice(-8))}&accountName=${encodeURIComponent(t.qrSnapshot.holder||'')}" alt="VietQR"></div>`:""}</div>`}
function showInvoice(t){if(!t)return;$("invoice").innerHTML=invoiceHTML(t)+`<div class="actions3"><button id="printInv" class="btn">PDF / In</button><button id="shareInv" class="btn">Chia sẻ</button><button id="pngInv" class="btn">PNG</button></div>`;open('invoiceModal');$('printInv').onclick=()=>window.print();$('shareInv').onclick=()=>navigator.share?navigator.share({title:'Hóa đơn EVTaximeter',text:`${money(t.totalFare)} • ${n(t.distanceKm).toFixed(2)} km`}):toast('Thiết bị không hỗ trợ chia sẻ');$('pngInv').onclick=()=>toast('PNG dùng trình duyệt để lưu ảnh hóa đơn')}
function showCustomer(name){let a=trips.filter(t=>t.status==="UNPAID"&&(t.customer||"Khách chưa đặt tên")==name);$('customerTitle').textContent=name;$('customerTrips').innerHTML=`<div class="card"><div class="row"><span>Tổng công nợ</span><b>${money(a.reduce((s,t)=>s+n(t.totalFare),0))}</b></div></div>`+a.map(t=>`<label class="card row"><span><input type="checkbox" data-debt="${esc(t.id)}"> ${new Date(t.finishedAt||t.startedAt).toLocaleDateString('vi-VN')}<br><span class="mini muted">${n(t.distanceKm).toFixed(2)} km • ${money(t.totalFare)}</span></span></label>`).join('')+`<div class="row"><button id="settleCash" class="btn primary">Tất toán tiền mặt</button><button id="settleTransfer" class="btn">Tất toán chuyển khoản</button></div>`;open('customerModal');let settle=method=>{let ids=[...$('customerTrips').querySelectorAll('[data-debt]:checked')].map(x=>x.dataset.debt);if(!ids.length){toast('Chọn ít nhất một chuyến');return}trips=trips.map(t=>ids.includes(t.id)?{...t,status:'PAID',payment:{method,status:'PAID'},qrSnapshot:null}:t);save();closeAll();renderHistory();renderRevenue();toast('Đã tất toán')};$('settleCash').onclick=()=>settle('cash');$('settleTransfer').onclick=()=>settle('transfer')}
function setPage(name){closeAll();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('page'+name).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='History')renderHistory();if(name==='Revenue')renderRevenue();if(name==='Settings')renderSettings()}
function restore(){try{let a=JSON.parse(localStorage.getItem(ACTIVE)||'null');if(!a||!a.id)return;if(Date.now()-n(a.startedAt)>48*3600*1000){activeClear();return}trip=a;adjust={...(a.adjustment||{})};state='PAUSED';gpsStatus('warn','Đã khôi phục chuyến • bấm Tiếp tục');ui();toast('Đã khôi phục chuyến chưa hoàn thành')}catch{activeClear()}}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
$('start').onclick=start;$('pause').onclick=()=>state==='PAUSED'?resume():pause();$('adjustBtn').onclick=()=>{$('disc').value=adjust.discount||'';$('pct').value=adjust.percent||'';$('sur').value=adjust.surcharge||'';$('toll').value=adjust.toll||'';adjustmentPreview();open('adjustModal')};['disc','pct','sur','toll'].forEach(id=>$(id).addEventListener('input',adjustmentPreview));$('adjCancel').onclick=()=>closeAll();$('adjOk').onclick=()=>{adjust={discount:Math.max(0,n($('disc').value)),percent:clamp(n($('pct').value),0,100),surcharge:Math.max(0,n($('sur').value)),toll:Math.max(0,n($('toll').value))};if(trip)trip.adjustment={...adjust};closeAll();ui();activeSave()};$('tariffBtn').onclick=()=>{renderTariffs();open('tariffModal')};$('tariffClose').onclick=()=>closeAll();$('cash').onclick=()=>finalize('cash','PAID');$('transfer').onclick=()=>{if(!cfg.vietqr.bank||!cfg.vietqr.account){toast('Nhập VietQR trong Cài đặt');return}finalize('transfer','PAID')};$('debt').onclick=()=>{$('debtBox').classList.remove('hidden');$('customer').focus()};$('debtOk').onclick=()=>{let c=$('customer').value.trim();if(!c){toast('Nhập tên khách hàng');return}finalize('debt','UNPAID',c)};$('invoiceClose').onclick=()=>closeAll();$('customerClose').onclick=()=>closeAll();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id!=='finishModal')closeAll()}));
$('finish').addEventListener('click',async()=>{if(state==='FINISHING')return;await finishTrip()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(state==='RUNNING'){beginGap('background');watchStop();activeSave()}}else if(state==='RUNNING'){watchStart();wakeStart();gpsStatus('warn','Đang xác nhận GPS sau khi quay lại')}});window.addEventListener('pagehide',()=>{if(state==='RUNNING')beginGap('pagehide');activeSave()});window.addEventListener('pageshow',()=>{if(state==='RUNNING')watchStart()});setInterval(tick,1000);renderHistory();renderRevenue();renderSettings();ui();restore();
</script></body></html>
